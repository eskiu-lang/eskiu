# Plugin coordinates
pluginGroup = xyz.reactvision.eskiu
pluginVersion = 0.14.1

# IntelliJ platform to build against: the first with the TextMateBundleProvider API.
# The plugin sets no upper bound, so it also installs in newer IDEs.
platformType = IC
platformVersion = 2024.1

# The platform TextMate plugin we contribute the bundle to.
platformBundledPlugins = org.jetbrains.plugins.textmate

# LSP4IJ to compile against: the last release for 2024.1 (later ones need 2024.2 and keep
# the API this plugin uses, so the IDE's current LSP4IJ works too).
lsp4ijVersion = 0.17.0

org.gradle.jvmargs = -Xmx2g
