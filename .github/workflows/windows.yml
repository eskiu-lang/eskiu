name: Windows build

# Windows x86-64 build of eskiuc plus the Windows checks of the stdlib, on every
# push to develop (and ci/windows, used to iterate on it) or on demand. Also
# produces a .zip that can be attached to a release. Kept separate from
# release.yml so it can run without cutting a release.
on:
  workflow_dispatch:
  push:
    branches: [develop, ci/windows]

jobs:
  build-windows-x86_64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 + LLVM
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-llvm
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-openssl
            diffutils
            git

      - name: Configure
        run: |
          # MSYS2 ships LLVM as libLLVM.dll (no usable static component libs), so link
          # LLVM dynamically and bundle the DLLs. The gcc runtime is static-linked.
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR="$MINGW_PREFIX/lib/cmake/llvm" \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++"

      - name: Build
        run: cmake --build build --target eskiuc -j"$(nproc)"

      - name: Exception unwinding E2E (SEH personality)
        run: |
          # Prove try/throw/catch actually unwinds on native Windows. eskiuc.exe emits a COFF
          # object whose EH uses the mingw SEH personality (__gxx_personality_seh0) and links it
          # through gcc with no -l flag: the driver adds -lstdc++ (the __cxa_* runtime + the SEH
          # unwinder) itself. The program must catch and print; a wrong personality would abort.
          cat > eh.esk <<'EOF'
          extern int printf(string fmt, ...);
          int main() {
              try { throw 42; }
              catch (int e) { printf("caught %d\n", e); }
              return 0;
          }
          EOF
          ./build/eskiuc.exe eh.esk -o eh.exe
          out=$(./eh.exe)
          echo "program output: $out"
          test "$out" = "caught 42"

      - name: Stdlib platform shims E2E (sysheap / threading / time)
        run: |
          # Exercise the POSIX-shimmed stdlib on native Windows: <sysheap> (VirtualAlloc page
          # backend), <threading> (pthread mutex via winpthreads) and <time> (clock_gettime /
          # nanosleep via winpthreads). <threading>'s #pragma link adds -lpthread; VirtualAlloc/Free
          # is in kernel32.
          cat > shims.esk <<'EOF'
          import <sysheap>;
          import <threading>;
          import <time>;
          extern int printf(string fmt, ...);
          int main() {
              let h: Heap;
              if (Heap_init(&h, 65536) == 0) { printf("heap fail\n"); return 1; }
              *int xs = (*int)Heap_alloc(&h, sizeof(int) * 4);
              xs[0] = 7;
              let m: Mutex;  Mutex_init(&m);  Mutex_lock(&m);  Mutex_unlock(&m);  Mutex_destroy(&m);
              int64 t0 = time_monotonic_ms();
              time_sleep_ms(1);
              int elapsed_ok = 0;
              if (time_monotonic_ms() - t0 >= 0) { elapsed_ok = 1; }
              printf("ok %d %d\n", xs[0], elapsed_ok);
              Heap_destroy(&h);
              return 0;
          }
          EOF
          ESKIU_ROOT="$PWD" ./build/eskiuc.exe shims.esk -o shims.exe
          out=$(./shims.exe)
          echo "program output: $out"
          test "$out" = "ok 7 1"

      - name: Sockets E2E (Winsock)
        run: |
          # A loopback TCP round-trip via <net>'s Winsock backend (WSAStartup + socket/bind/
          # listen/accept/connect/send/recv/closesocket). <net>'s #pragma link adds ws2_32.
          cat > net.esk <<'EOF'
          import <net>;
          extern int printf(string fmt, ...);
          int main() {
              int ls = net_tcp_listen(54321);
              if (ls < 0) { printf("listen fail\n"); return 1; }
              int c = net_tcp_connect("127.0.0.1", 54321);
              if (c < 0) { printf("connect fail\n"); return 1; }
              int s = net_accept(ls);
              if (s < 0) { printf("accept fail\n"); return 1; }
              net_send_str(c, "hi");
              uint8[8] buf;
              int64 n = net_recv(s, (*void)&buf[0], 8);
              printf("got %d %c%c\n", (int)n, (char)buf[0], (char)buf[1]);
              net_close(c); net_close(s); net_close(ls);
              return 0;
          }
          EOF
          ESKIU_ROOT="$PWD" ./build/eskiuc.exe net.esk -o net.exe
          out=$(./net.exe)
          echo "program output: $out"
          test "$out" = "got 2 hi"

      - name: Async reactor E2E (WSAPoll)
        run: |
          # An async socket round-trip over the reactor: a non-blocking socket is registered
          # with the event loop (WSAPoll backend), a peer sends 5 bytes, and net_read_async
          # completes on the first dispatch. Exercises <eventloop> (WSAPoll + fd-indexed slots
          # that grow to fit Windows' large SOCKET handles) + <net_async> (ioctlsocket
          # non-blocking + recv + WSAGetLastError). ws2_32 comes from #pragma link. A timeout guards against a
          # reactor hang so a regression fails fast instead of running to the job limit.
          cat > async.esk <<'EOF'
          import <net_async>;
          import <net>;
          extern int printf(string fmt, ...);
          uint8[64] g_buf;
          int main() {
              int ls = net_tcp_listen(54322);
              int c  = net_tcp_connect("127.0.0.1", 54322);
              int s  = net_accept(ls);
              net_send_str(c, "hello");
              EventLoop* lp = el_new(64);
              net_set_nonblocking(s);
              Future<int>* f = net_read_async(lp, s, &g_buf[0], (int64)64);
              Future_poll<int>(f, void() { Future_free<int>(f); EventLoop_stop(lp); });
              EventLoop_run(lp);
              printf("read %c%c%c\n", (char)g_buf[0], (char)g_buf[1], (char)g_buf[4]);
              EventLoop_free(lp);
              net_close(c); net_close(s); net_close(ls);
              return 0;
          }
          EOF
          ESKIU_ROOT="$PWD" ./build/eskiuc.exe async.esk -o async.exe
          out=$(timeout 20 ./async.exe)
          echo "program output: $out"
          test "$out" = "read heo"

      - name: Scripting stdlib tests
        run: |
          # Every test of the 0.10 scripting modules, built and run on Windows
          # (tests/windows/run.sh). fetch_https needs OpenSSL: MSYS2's
          # libssl-3-x64.dll is on PATH here, and ESKIU_REQUIRE_TLS makes a
          # missing one a failure instead of a skip.
          ESKIU_REQUIRE_TLS=1 ESKIUC="$PWD/build/eskiuc.exe" tests/windows/run.sh

      - name: Terminal on a real console
        if: ${{ !cancelled() }}
        run: |
          # The job's output is redirected, so the program opens a console of its
          # own and checks VT mode, colors and term_width on it.
          ./build/eskiuc.exe tests/windows/term_console.esk -o winbin/term_console.exe
          timeout 60 ./winbin/term_console.exe

      - name: HTTPS with the Windows trust store (network)
        if: ${{ !cancelled() }}
        run: |
          # Verification on, no ca_file: the roots come from the Windows "ROOT"
          # certificate store (<fetch_tls>), not from OpenSSL's default paths.
          ./build/eskiuc.exe tests/windows/fetch_system_roots.esk -o winbin/fetch_system_roots.exe
          timeout 120 ./winbin/fetch_system_roots.exe

      - name: Example scripts
        if: ${{ !cancelled() }}
        run: ESKIUC="$PWD/build/eskiuc.exe" tests/scripts/check.sh

      - name: REPL left out on Windows
        if: ${{ !cancelled() }}
        run: |
          # `eskiuc repl` is not available on Windows in this release: it must say so and
          # exit 1 instead of starting a session.
          set +e
          mkdir -p winbin
          printf '1 + 1\n' > winbin/repl.in
          ./build/eskiuc.exe repl < winbin/repl.in > winbin/repl.out 2>&1
          code=$?
          out=$(tr -d '\r' < winbin/repl.out)
          want='error: `eskiuc repl` is not available on Windows in this release; run a file with `eskiuc run file.esk`'
          if [ "$out" = "$want" ] && [ "$code" -eq 1 ]; then
            echo "ok repl/not-available"
          else
            echo "FAIL repl/not-available (exit $code): $out"; exit 1
          fi

      - name: Package manager
        if: ${{ !cancelled() }}
        run: ESKIUC="$PWD/build/eskiuc.exe" tests/pkg/check.sh

      - name: Package
        run: |
          mkdir -p dist/bin dist/lib/eskiu
          cp build/eskiuc.exe dist/bin/eskiuc.exe
          strip dist/bin/eskiuc.exe
          # Bundle the MinGW DLLs eskiuc.exe needs (libLLVM, zlib, zstd, ...).
          ldd dist/bin/eskiuc.exe | grep -i '/mingw64/bin/' | awk '{print $3}' \
            | while read -r dll; do cp "$dll" dist/bin/; done
          cp -r stdlib dist/lib/eskiu/stdlib
          powershell -Command "Compress-Archive -Path dist/bin,dist/lib -DestinationPath eskiuc-windows-x86_64.zip -Force"

      - name: Smoke test the packaged .exe
        shell: pwsh
        run: |
          # Native PowerShell (no MSYS2 on PATH): proves the zip is self-contained
          # (bundled DLLs) and that eskiuc.exe resolves its stdlib from its own path.
          Expand-Archive eskiuc-windows-x86_64.zip -DestinationPath smoke -Force
          .\smoke\bin\eskiuc.exe --version
          .\smoke\bin\eskiuc.exe examples\hello.esk -o hello.obj -c
          if (!(Test-Path hello.obj)) { throw "eskiuc.exe did not produce an object file" }
          Write-Host "smoke OK: eskiuc.exe runs and emits an object"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eskiuc-windows-x86_64
          path: eskiuc-windows-x86_64.zip
          retention-days: 7

  install-script:
    # site/install.ps1, the one-line install the site shows, against the latest release.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: install.ps1 installs the latest release
        shell: pwsh
        run: |
          $env:ESKIU_PREFIX = "$env:RUNNER_TEMP\eskiu"
          & ./site/install.ps1
          $v = & "$env:RUNNER_TEMP\eskiu\bin\eskiuc.exe" --version
          if ($v -notmatch '^Eskiu ') { throw "unexpected version: $v" }
          Write-Host "PASS install.ps1: $v"
