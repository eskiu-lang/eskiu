name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    # libssl is installed below, so tests/fetch_https.esk must run its HTTPS checks
    # instead of printing "skipped".
    env:
      ESKIU_REQUIRE_TLS: 1
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 22 + toolchain
        run: |
          sudo apt-get update
          # libssl-dev: OpenSSL 3, which <tls> links and <fetch_tls> loads at run time.
          sudo apt-get install -y cmake build-essential libc++-dev libc++abi-dev libssl-dev
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y llvm-22-dev clang-22
          echo "LLVM_DIR=/usr/lib/llvm-22/lib/cmake/llvm" >> $GITHUB_ENV

      - name: Configure & build
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR=$LLVM_DIR \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DESKIU_WERROR=ON
          cmake --build build --target eskiuc -j"$(nproc)"
          # Dual-build (promotion P4): the C++ seed builds the Eskiu-written compiler too.
          cmake --build build --target eskiuc-selfhost -j"$(nproc)"

      # The full test suite, three ways. The sanitizer runs are the hardening
      # gate: a class of codegen bug (e.g. allocas leaking stack inside loops)
      # shows up here even when the plain run passes. clang-22 keeps the asan
      # ABI in sync with the compiler's own instrumentation.
      - name: Tests
        run: CC=clang-22 tests/run.sh

      - name: Tests (ubsan)
        run: CC=clang-22 SANITIZE=ubsan tests/run.sh

      - name: Tests (asan)
        run: CC=clang-22 SANITIZE=asan tests/run.sh

      # Bounded, deterministic fuzz pass: generates/mutates programs and fails on
      # any compiler crash, IR-verifier failure, or O0-vs-O2 runtime divergence.
      # ESKIU_CLANG enables the differential oracle (clang installed as clang-22).
      # Fixed seed so a green run is reproducible; raise --iterations for nightly.
      - name: Fuzz (compiler)
        run: ESKIU_CLANG=clang-22 python3 tests/fuzz/eskiu_fuzz.py --iterations 1500 --seed 1

      # External oracle: generated programs in a C-translatable subset (every integer
      # width, casts, control flow, arrays, structs, pointers, globals, statics, defer)
      # must print exactly what their C translation prints under clang -O0 -fwrapv, for
      # the C++ eskiuc (-O0 and -O2) and the self-hosted eskiuc-esk. It catches bugs
      # both Eskiu compilers share, which the differentials above cannot see.
      - name: Fuzz (C oracle)
        run: ESKIU_CLANG=clang-22 python3 tests/fuzz/eskiu_fuzz.py --oracle-only --oracle 200 --oracle-ext 100 --seed 1

      # Negative corpus: generated programs with one injected type/semantic error must be
      # rejected by both compilers with a file:line:col diagnostic on the error's line,
      # never accepted, crashed on, or turned into bad IR.
      - name: Fuzz (negative corpus)
        run: ESKIU_CLANG=clang-22 python3 tests/fuzz/neg_fuzz.py --programs 300 --seed 1

      # Stdlib parsers (json, base64, url, regex, hpack, http, multipart, uuid/time)
      # under AddressSanitizer: a seeded mutation loop; a crash, ASan report, broken
      # round trip, hang or memory blowup fails.
      - name: Fuzz (stdlib, asan)
        run: CC=clang-22 python3 tests/fuzz/stdlib_fuzz.py --inputs 1500 --seed 1

      # How long the editor modes take on a script with a dozen stdlib imports (what an
      # editor waits for on each keystroke). Reported, not enforced.
      - name: Editor timing
        run: |
          f=examples/scripts/organize.esk
          for mode in "--test-typechecker" "--complete-at 79:20" "--symbols"; do
            s=$(date +%s%N); ./build/eskiuc $f $mode > /dev/null 2>&1; e=$(date +%s%N)
            echo "eskiuc $mode: $(( (e - s) / 1000000 )) ms"
          done
          s=$(date +%s%N); ./build/eskiuc fmt --check $f > /dev/null 2>&1; e=$(date +%s%N)
          echo "eskiuc fmt --check: $(( (e - s) / 1000000 )) ms"

      # The inputs a fuzz step flagged, to reproduce a finding locally.
      - name: Fuzz findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: tests/fuzz/findings/
          if-no-files-found: ignore

      # -O0 vs -O2 behavioral differential over the whole corpus: a program must
      # behave identically with and without the middle-end optimizer. Catches
      # optimization-path miscompiles (bad IR attributes, type/ABI mismatches, UB)
      # that -O0 tolerates but -O2 exploits — e.g. the 0.3.1 float-closure fix.
      - name: Optimization differential (-O0 vs -O2)
        run: CC=clang-22 tests/opt_differential.sh

      # `--safe` inserts runtime slice/array bounds checks that trap on a violation,
      # are off by default (opt-in, zero release cost), and leave in-bounds code alone.
      - name: Safe mode (bounds checks)
        run: CC=clang-22 tests/safe_mode.sh

      # `?*T` checked nullable pointer: unchecked deref rejected, `if (x != null)`
      # narrows, `*T` widens to `?*T` but not vice-versa. (C++ compiler; self-host
      # mirror is on the promotion track.)
      - name: Nullable pointers
        run: CC=clang-22 tests/nullable.sh

      # Bare-metal ARM64 kernel (kernel/): cross-compile, link with lld, boot it in
      # QEMU -M virt headless and check its UART output. The kernel powers QEMU off.
      - name: Bare-metal kernel (QEMU)
        run: |
          sudo apt-get install -y qemu-system-arm lld-22
          make -C kernel check ESKIUC=../build/eskiuc CLANG=clang-22 LLD=ld.lld-22

      # Self-hosted lexer (selfhost/) must stay byte-identical to the C++ lexer
      # over the whole preprocessor-free corpus. The driver is compiled once to a
      # native binary, so this is ~seconds. A divergence means the Eskiu lexer (or
      # the C++ lexer it mirrors) changed.
      - name: Lexer self-host parity
        run: tests/selfhost/lex_parity.sh --full

      # Self-hosted parser (selfhost/parser.esk) must produce an AST dump byte-
      # identical to the C++ --test-parser over the import-free corpus. Compiles
      # the driver once; ~seconds. Excludes files that import or that the C++
      # --test-parser itself can't print (top-level prototypes crash its printer).
      - name: Parser self-host parity
        run: tests/selfhost/parse_parity.sh --full

      # Self-hosted preprocessor (selfhost/preprocessor.esk) validated through the
      # lexer: pp_main preprocesses + lexes and must match the C++ --test-lexer
      # (which preprocesses too) over the whole tests/ + stdlib/ corpus — no
      # exclusions, since every directive is now handled. Compiles once; ~seconds.
      - name: Preprocessor self-host parity
        run: tests/selfhost/pp_parity.sh --full

      # Self-hosted type checker (selfhost/sema.esk) must reach the same verdict as
      # the C++ --test-typechecker over the positive corpus (no false rejections),
      # and reject the implemented tests/errors classes with the right message.
      # Compiles tc_main once; ~seconds.
      - name: Sema self-host parity
        run: tests/selfhost/tc_parity.sh

      # Editor modes (--hover-at/--definition-at/--complete-at/--symbols): every
      # tests/lsp query gives byte-identical output from both compilers.
      - name: Editor modes self-host parity
        run: tests/selfhost/lsp_parity.sh

      # Self-hosted code generator (selfhost/codegen.esk): emit LLVM IR, compile it
      # with clang, run, and compare exit code + stdout to the C++-built binary over
      # the synthetic corpus. Behavioral oracle (IR can't match byte-for-byte). clang
      # is installed as clang-22 on the runner.
      - name: Codegen self-host parity
        run: CLANG=clang-22 tests/selfhost/cg_parity.sh

      # Self-hosted EIR builder (selfhost/eir.esk): `--test-eir` byte-identical to the
      # C++ one for every test listed in tests/selfhost/eir_parity_pass.txt.
      - name: EIR self-host parity
        run: tests/selfhost/eir_parity.sh

      # Phase D bootstrap gate: cg_main emits valid IR for the WHOLE self-hosted
      # compiler (lexer→codegen + drivers), and cg_main compiled by ITSELF reproduces
      # the C++-built codegen's IR byte-for-byte (a self-consistent fixpoint).
      - name: Codegen self-compilation (bootstrap fixpoint)
        run: CLANG=clang-22 tests/selfhost/cg_selfhost.sh

      # Three-stage bootstrap over the unified driver (esk_main.esk: pp→parse→sema→
      # codegen): the C++ eskiuc builds it (cc0), cc0 builds it (cc1), cc1 builds it
      # (cc2); cc1 and cc2 must emit identical IR (stage2 ≡ stage3 = a true fixpoint),
      # and cc2 must compile a runnable program.
      - name: Compiler bootstrap (3-stage fixpoint)
        run: CLANG=clang-22 tests/selfhost/cg_bootstrap.sh

      # The self-hosted compiler built with AddressSanitizer over the whole corpus: no
      # memory error in the compiler itself.
      - name: Self-host under ASan
        run: CC=clang-22 tests/selfhost/asan_selfhost.sh

      # Self-hosted driver end to end: esk_main.esk parses/checks/codegens AND invokes
      # clang to link a native binary. Compare the resulting binaries' exit + stdout to
      # the C++ eskiuc's over a small corpus (promotion P0).
      - name: Driver self-host parity
        run: CLANG=clang-22 tests/selfhost/driver_parity.sh

      # `eskiuc run script.esk`: compile to a temp exe, execute, propagate exit code.
      # Compare the self-host `run` to the C++ `run` over the same corpus (promotion P2).
      - name: Run self-host parity
        run: CLANG=clang-22 tests/selfhost/run_parity.sh

      # The example scripts (examples/scripts/) run through their shebang line with the
      # self-hosted compiler as `eskiuc`: repo_stats against a local fake GitHub API,
      # organize on a temporary tree. tests/run.sh above ran them with the C++ compiler.
      - name: Example scripts (self-hosted compiler)
        run: CC=clang-22 CLANG=clang-22 ESKIUC=build/eskiuc-esk tests/scripts/check.sh

      # `eskiuc fmt`: the self-host reformatter must be byte-identical to the C++ one
      # over the whole in-repo corpus (implies idempotency; promotion P2).
      - name: Fmt self-host parity
        run: CLANG=clang-22 tests/selfhost/fmt_parity.sh

      # Whole-corpus behavioral equivalence: every positive test compiled by the
      # Eskiu-built compiler produces the same exit + stdout as the C++ one (promotion P3;
      # the negative-corpus verdict + diagnostic side is covered by tc_parity above).
      - name: Corpus behavioral parity
        run: CLANG=clang-22 tests/selfhost/corpus_parity.sh

      # `--safe` bounds-check mirror: the self-host emits the same runtime slice/array
      # bounds checks as the C++ back-end (OOB traps, in-bounds does not, off by default).
      - name: Safe-mode self-host parity
        run: CC=clang-22 tests/selfhost/safe_parity.sh

      # `?*T` nullable-pointer mirror: the self-host front-end enforces the same checked
      # nullable rules as the C++ compiler (unchecked deref rejected, `if (x != null)`
      # narrows, `?*T`->`*T` needs a check, `*T`->`?*T` widens).
      - name: Nullable self-host parity
        run: CC=clang-22 tests/selfhost/nullable_parity.sh

      # C-ABI lowering parity: every lowered extern declaration and callback thunk the
      # self-host emits must match the C++ compiler's signature, across 9 target triples.
      - name: C ABI self-host parity
        run: CLANG=clang-22 tests/selfhost/cabi_parity.sh

      # The EIR C99 backend on Linux, where `--backend=eir` takes the C path: a run test
      # listed in tests/eir/pass_c_linux.txt that stops passing fails the build.
      - name: EIR C backend
        run: CC=clang-22 tests/eir/check.sh c

  # Leak checking on its own: tests/run.sh runs ASan with detect_leaks=0 (short-lived test
  # programs), so the constructs that must never leak (async frames, cancellation cleanups,
  # closure environments, channels, defer unwinding, allocators) are checked here with
  # LeakSanitizer, which works on Linux x86-64.
  leaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 22 + toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libc++-dev libc++abi-dev
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y llvm-22-dev clang-22
          echo "LLVM_DIR=/usr/lib/llvm-22/lib/cmake/llvm" >> $GITHUB_ENV

      - name: Configure & build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLLVM_DIR=$LLVM_DIR -DCMAKE_CXX_COMPILER=clang++-22
          cmake --build build --target eskiuc -j"$(nproc)"

      - name: Leak checks (ASan + LeakSanitizer)
        run: CC=clang-22 tests/leaks.sh build/eskiuc

  # macOS arm64: the release platform for Apple Silicon. The full test suite and a smoke of
  # the self-host parity gates (the Linux job runs the complete set).
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 22
        run: |
          brew install llvm@22 cmake
          echo "LLVM_DIR=$(brew --prefix llvm@22)/lib/cmake/llvm" >> $GITHUB_ENV
          echo "CLANG=$(brew --prefix llvm@22)/bin/clang" >> $GITHUB_ENV

      - name: Configure & build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLLVM_DIR=$LLVM_DIR -DESKIU_SELFHOST_CLANG=$CLANG -DESKIU_WERROR=ON
          cmake --build build --target eskiuc -j"$(sysctl -n hw.ncpu)"
          cmake --build build --target eskiuc-selfhost -j"$(sysctl -n hw.ncpu)"

      - name: Tests
        run: CC=$CLANG tests/run.sh

      - name: Self-host parity (smoke)
        run: |
          export ESKIUC=$PWD/build/eskiuc ESKIUC_ESK=$PWD/build/eskiuc-esk ESKIU_CLANG=$CLANG
          tests/selfhost/tc_parity.sh
          tests/selfhost/cg_parity.sh
          tests/selfhost/driver_parity.sh

      # The native EIR backends (no LLVM code generator): ARM64 assembly and C99. A run
      # test listed in tests/eir/pass_<mode>.txt that stops passing fails the build.
      - name: EIR backends
        run: |
          tests/eir/check.sh asm
          CC=$CLANG tests/eir/check.sh c
