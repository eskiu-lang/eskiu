name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── macOS arm64 (Apple Silicon) ────────────────────────────────────────
  build-macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM
        run: |
          # Pin to LLVM 22 (bare `llvm` now resolves to 23, whose TargetRegistry API
          # differs), matching the Linux job's `llvm-22-dev` pin.
          brew install llvm@22 cmake dylibbundler
          echo "LLVM_DIR=$(brew --prefix llvm@22)/lib/cmake/llvm" >> $GITHUB_ENV

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR=$LLVM_DIR \
            -DESKIU_WERROR=ON

      - name: Build
        run: cmake --build build --target eskiuc -j$(sysctl -n hw.ncpu)

      - name: Package
        run: |
          mkdir -p dist/bin dist/lib/eskiu
          cp build/eskiuc dist/bin/eskiuc
          strip dist/bin/eskiuc
          cp -r stdlib dist/lib/eskiu/stdlib
          # Homebrew LLVM pulls in z3 and zstd as dynamic libs at versioned /opt/homebrew paths,
          # so a bare binary fails to load on any Mac without those exact libs (the shipped
          # v0.7.0 binary did not run on a clean machine). Bundle them into lib/deps and rewrite
          # the load paths to @loader_path/../lib/deps so the tarball is self-contained;
          # dylibbundler re-signs the modified binary, which arm64 requires.
          dylibbundler -cd -of -b -x dist/bin/eskiuc -d dist/lib/deps -p "@loader_path/../lib/deps/"
          # Fail loudly if any Homebrew-pathed dependency slipped through (e.g. a new LLVM dep).
          if otool -L dist/bin/eskiuc | grep -q '/opt/homebrew'; then
            echo "error: eskiuc still references a Homebrew path after bundling"; otool -L dist/bin/eskiuc; exit 1
          fi
          ( cd dist && ./bin/eskiuc --version )   # sanity: the packaged binary runs
          tar -czf eskiuc-macos-arm64.tar.gz -C dist bin lib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eskiuc-macos-arm64
          path: eskiuc-macos-arm64.tar.gz
          # Transient build→release handoff only; the real binaries are attached to
          # the GitHub Release. Expire fast so they don't pile up in Actions storage.
          retention-days: 7

  # ── Linux x86_64 ───────────────────────────────────────────────────────
  build-linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 22
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential patchelf
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y llvm-22-dev
          echo "LLVM_DIR=/usr/lib/llvm-22/lib/cmake/llvm" >> $GITHUB_ENV

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR=$LLVM_DIR \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DESKIU_WERROR=ON

      - name: Build
        run: cmake --build build --target eskiuc -j$(nproc)

      - name: Package
        run: |
          mkdir -p dist/bin dist/lib/eskiu
          cp build/eskiuc dist/bin/eskiuc
          strip dist/bin/eskiuc
          cp -r stdlib dist/lib/eskiu/stdlib
          # LLVM pulls in z3 and zstd as shared libs; z3 in particular is not present on a stock
          # machine, so the bare binary fails to start without it. Bundle those into lib/deps and
          # point an $ORIGIN-relative RUNPATH at them so the tarball is self-contained. zlib, libc,
          # libstdc++ and libgcc are assumed present on any Linux and left to the system.
          mkdir -p dist/lib/deps
          for name in libz3 libzstd; do
            so=$(ldd dist/bin/eskiuc | awk -v n="$name" '$0 ~ n {print $3; exit}')
            if [ -n "$so" ]; then cp -L "$so" dist/lib/deps/; echo "bundled $(basename "$so")"; fi
          done
          patchelf --set-rpath '$ORIGIN/../lib/deps' dist/bin/eskiuc
          # Guard: z3 must now resolve to the bundled copy, not a system path.
          if ! ldd dist/bin/eskiuc | grep libz3 | grep -q 'lib/deps'; then
            echo "error: libz3 was not bundled / RUNPATH not taking effect"; ldd dist/bin/eskiuc; exit 1
          fi
          tar -czf eskiuc-linux-x86_64.tar.gz -C dist bin lib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eskiuc-linux-x86_64
          path: eskiuc-linux-x86_64.tar.gz
          # Transient build→release handoff only; the real binaries are attached to
          # the GitHub Release. Expire fast so they don't pile up in Actions storage.
          retention-days: 7

  # ── Linux arm64 (aarch64) ──────────────────────────────────────────────
  # Native build on GitHub's hosted arm64 Linux runner (no cross-compile). Same
  # LLVM 22 pin and self-contained packaging as the x86_64 job.
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 22
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential patchelf
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y llvm-22-dev
          echo "LLVM_DIR=/usr/lib/llvm-22/lib/cmake/llvm" >> $GITHUB_ENV

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR=$LLVM_DIR \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DESKIU_WERROR=ON

      - name: Build
        run: cmake --build build --target eskiuc -j$(nproc)

      - name: Package
        run: |
          mkdir -p dist/bin dist/lib/eskiu
          cp build/eskiuc dist/bin/eskiuc
          strip dist/bin/eskiuc
          cp -r stdlib dist/lib/eskiu/stdlib
          # Bundle z3/zstd (not present on a stock machine) and point an $ORIGIN-relative
          # RUNPATH at them so the tarball is self-contained. See the x86_64 job for detail.
          mkdir -p dist/lib/deps
          for name in libz3 libzstd; do
            so=$(ldd dist/bin/eskiuc | awk -v n="$name" '$0 ~ n {print $3; exit}')
            if [ -n "$so" ]; then cp -L "$so" dist/lib/deps/; echo "bundled $(basename "$so")"; fi
          done
          patchelf --set-rpath '$ORIGIN/../lib/deps' dist/bin/eskiuc
          if ! ldd dist/bin/eskiuc | grep libz3 | grep -q 'lib/deps'; then
            echo "error: libz3 was not bundled / RUNPATH not taking effect"; ldd dist/bin/eskiuc; exit 1
          fi
          tar -czf eskiuc-linux-arm64.tar.gz -C dist bin lib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eskiuc-linux-arm64
          path: eskiuc-linux-arm64.tar.gz
          retention-days: 7

  # ── Windows x86_64 ─────────────────────────────────────────────────────
  # Built under MSYS2/MinGW, whose LLVM package ships the dev libraries + CMake
  # config the tool links against. LLVM is linked dynamically (libLLVM.dll and the DLLs
  # it needs are bundled next to the .exe); libgcc and libstdc++ are linked statically.
  build-windows-x86_64:
    runs-on: windows-latest
    # Windows is a supported host with a prebuilt binary (README), and windows.yml runs
    # the same build on every push and pull request, so a failure here fails the release.
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 + LLVM
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-llvm
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            unzip

      - name: Configure
        run: |
          # Build with MinGW g++ (not clang++): clang cannot parse the newer libstdc++
          # 16 preprocessor headers this toolchain ships. MSYS2 ships LLVM as libLLVM.dll
          # (no usable static component libs), so link LLVM dynamically and bundle the
          # DLLs; the gcc runtime is static-linked.
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR="$MINGW_PREFIX/lib/cmake/llvm" \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++" \
            -DESKIU_WERROR=ON

      - name: Build
        run: cmake --build build --target eskiuc -j"$(nproc)"

      - name: Package
        run: |
          mkdir -p dist/bin dist/lib/eskiu
          cp build/eskiuc.exe dist/bin/eskiuc.exe
          strip dist/bin/eskiuc.exe
          # Bundle the MinGW DLLs eskiuc.exe needs (libLLVM, zlib, zstd, ...).
          ldd dist/bin/eskiuc.exe | grep -i '/mingw64/bin/' | awk '{print $3}' \
            | while read -r dll; do cp "$dll" dist/bin/; done
          cp -r stdlib dist/lib/eskiu/stdlib
          # Zip with Windows' own bsdtar: Compress-Archive (Windows PowerShell 5) stores
          # paths with backslashes, which unzip warns about and exits with 1.
          /c/Windows/System32/tar.exe -a -c -f eskiuc-windows-x86_64.zip -C dist bin lib
          unzip -q -t eskiuc-windows-x86_64.zip

      - name: Smoke test the packaged .exe
        shell: pwsh
        run: |
          # Native PowerShell (no MSYS2 on PATH): proves the zip is self-contained
          # and eskiuc.exe resolves its stdlib from its own path.
          Expand-Archive eskiuc-windows-x86_64.zip -DestinationPath smoke -Force
          .\smoke\bin\eskiuc.exe --version
          .\smoke\bin\eskiuc.exe examples\hello.esk -o hello.obj -c
          if (!(Test-Path hello.obj)) { throw "eskiuc.exe did not produce an object file" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eskiuc-windows-x86_64
          path: eskiuc-windows-x86_64.zip
          retention-days: 7

  # ── GitHub Release ─────────────────────────────────────────────────────
  release:
    needs: [build-macos-arm64, build-linux-x86_64, build-linux-arm64, build-windows-x86_64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Checksums
        run: |
          # One SHA256SUMS over whatever assets built (the Windows zip may be absent). The
          # installer and the Homebrew formula verify downloads against this file.
          for f in eskiuc-*.tar.gz eskiuc-*.zip; do
            [ -f "$f" ] && sha256sum "$f"
          done > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Eskiu ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          overwrite: true
          files: |
            eskiuc-macos-arm64.tar.gz
            eskiuc-linux-x86_64.tar.gz
            eskiuc-linux-arm64.tar.gz
            eskiuc-windows-x86_64.zip
            SHA256SUMS
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
